<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" fill="none">
  <defs>
    <linearGradient id="c" x1="40" y1="20" x2="320" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF2FF"/><stop offset="1" stop-color="#DCE4FF"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#5B7CFA"/><stop offset="1" stop-color="#3157D5"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7EA0FF"/><stop offset="1" stop-color="#3157D5"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#3157D5" flood-opacity=".18"/>
    </filter>
  </defs>
  <circle cx="180" cy="160" r="140" fill="#3157D5" fill-opacity=".1"/>
  <!-- leaves -->
  <path d="M86 236c-30-20-38-58-24-90 28 16 38 54 24 90Z" fill="url(#leaf)" opacity=".8"/>
  <path d="M96 238c-6-36 14-68 46-78 6 32-14 66-46 78Z" fill="url(#leaf)" opacity=".55"/>
  <!-- bars -->
  <g filter="url(#sh)">
    <rect x="132" y="178" width="30" height="62" rx="6" fill="url(#bar)" opacity=".55"/>
    <rect x="172" y="146" width="30" height="94" rx="6" fill="url(#bar)" opacity=".75"/>
    <rect x="212" y="110" width="30" height="130" rx="6" fill="url(#bar)"/>
  </g>
  <path d="M128 160l40-28 32 14 52-56" stroke="#26A786" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M236 86l18-2-2 18" stroke="#26A786" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- trophy -->
  <g filter="url(#sh)">
    <path d="M262 168h40v12c0 14-9 24-20 24s-20-10-20-24v-12Z" fill="#FFB020"/>
    <path d="M262 174h-8c0 10 6 16 12 16M302 174h8c0 10-6 16-12 16" stroke="#FFB020" stroke-width="4" stroke-linecap="round"/>
    <rect x="277" y="204" width="10" height="14" fill="#E29A10"/>
    <rect x="266" y="218" width="32" height="10" rx="3" fill="#E29A10"/>
  </g>
  <!-- base -->
  <rect x="104" y="240" width="210" height="6" rx="3" fill="#3157D5" fill-opacity=".25"/>
  <!-- check badge -->
  <g filter="url(#sh)">
    <circle cx="112" cy="104" r="22" fill="#26A786"/>
    <path d="M102 104l7 7 13-14" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
